name: Final Calling candidate - narrow composer repair gates

# Candidate validation only: no deployment, production credentials or service calls.
on:
  push:
    branches: [codex/calling-release-composer-20260909]

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/codex/calling-release-composer-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      BASELINE: 17a1785ced9e36303036c5994fafde42eeff9063
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze Calling reconciliation, diagnostic baseline and rollback
        run: |
          python3 - <<'PYGUARD'
          import os, subprocess
          base = os.environ['BASELINE']
          allowed = {
            '.github/workflows/calling-composer-release-candidate.yml',
            'src/lib/sales/whatsapp-composer.core.ts',
            'tests/whatsapp-composer.test.ts',
          }
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^') == base, 'Final candidate must directly extend frozen Calling reconciliation'
          changed = set(git('diff','--name-only',base,'HEAD').splitlines())
          assert changed <= allowed, 'Protected path changed: '+repr(sorted(changed-allowed))
          for ref, sha in {
            'origin/main': '5a99d0166560afc8c0cfa9c9bb3171105e3f7ec6',
            'origin/rollback/p0-calling-human-quality-5a99d01-20260909': '5a99d0166560afc8c0cfa9c9bb3171105e3f7ec6',
            'origin/codex/calling-human-quality-isolated-20260909': 'c6d025a88f988974b7be3876226d12db31bed4e4',
            'origin/codex/calling-ice-diagnostics-20260909': 'a7f653372aaaa5e80e2b9f9c7e6c0b53d380b93c',
            'origin/codex/calling-reconciled-a7f6533-20260909': base,
          }.items():
            assert git('rev-parse',ref) == sha, 'Protected ref moved: '+ref
          # Tree identity includes every native implementation, test, lock and build file.
          assert git('rev-parse',base+':voice-gateway') == git('rev-parse','HEAD:voice-gateway')
          test_diff = git('diff','--unified=0',base,'HEAD','--','tests/whatsapp-composer.test.ts')
          assert not any(line.startswith('-') and not line.startswith('---') for line in test_diff.splitlines()), 'Existing test assertion removed or modified'
          subprocess.run(['git','diff','--check',base,'HEAD'],check=True)
          print('PASS: Calling humanization, termination, diagnostics, Voice Note, MiniMax and networking remain byte-identical to frozen 17a1785.')
          print('PASS: native tree unchanged; native race/build/vet evidence retained from run 34378613888, no native rerun needed.')
          print('PASS: original composer assertions retained; main and rollback preserved.')
          print('Exact repair paths:\n'+'\n'.join(sorted(changed)))
          PYGUARD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install test-only tooling and frozen application dependencies
        id: install
        run: |
          npm install --prefix "$RUNNER_TEMP/calling-tools" --ignore-scripts --no-audit --no-fund bun@1.3.10 vitest@4.0.18 @typescript/native-preview@7.0.0-dev.20260707.2
          node "$RUNNER_TEMP/calling-tools/node_modules/bun/install.js"
          "$RUNNER_TEMP/calling-tools/node_modules/.bin/bun" install --frozen-lockfile --ignore-scripts
      - name: Two baseline failures repeated twenty times, original assertions unchanged
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          for iteration in $(seq 1 20); do
            "$RUNNER_TEMP/calling-tools/node_modules/.bin/vitest" run tests/whatsapp-composer.test.ts -t 'flags: Langganan perlu dinaik taraf|scrubs the leaking sentence and keeps the helpful answer around it' --reporter=dot > "$RUNNER_TEMP/composer-repeat.log" 2>&1 || { cat "$RUNNER_TEMP/composer-repeat.log"; exit 1; }
          done
          cat "$RUNNER_TEMP/composer-repeat.log"
          echo 'PASS: both original failures passed twenty consecutive repetitions.'
      - name: Calling, Voice Note and WhatsApp Text regression gates
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          prefixes = ('voice-', 'call-', 'calling-', 'minimax-', 'opus-', 'whatsapp-voice')
          extra = {
            'gateway-run-text.test.ts', 'whatsapp-webhook-security.test.ts',
            'whatsapp-coalescing-identity.test.ts', 'whatsapp-conversational-guard.test.ts',
            'whatsapp-outbound-timeout.test.ts', 'console-outbound-text-voice.test.ts', 'whatsapp-composer.test.ts',
            'whatsapp-inbound-calls-v1.test.ts', 'whatsapp-calling-pre-accept-p0.test.ts',
          }
          files = sorted(str(p) for p in pathlib.Path('tests').glob('*.test.ts') if p.name.startswith(prefixes) or p.name in extra)
          runner = os.environ['RUNNER_TEMP'] + '/calling-tools/node_modules/.bin/vitest'
          subprocess.run([runner, 'run', '--reporter=default', '--reporter=json', '--outputFile.json=calling-test-results.json', *files], check=True)
          PY
      - name: Typecheck and application build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/calling-tools/node_modules/.bin/tsgo" --noEmit
          npm run build > "$RUNNER_TEMP/calling-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/calling-build.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/calling-build.log"
      - name: Verify validation left protected source and dependency locks untouched
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          git diff --exit-code
          echo 'PASS: tracked source unchanged by tests; overall release readiness also requires every preceding gate to pass.'
