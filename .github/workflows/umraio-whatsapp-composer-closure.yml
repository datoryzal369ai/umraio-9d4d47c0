name: UMRAIO WhatsApp Composer P0 Closure

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/lib/sales/whatsapp-composer.core.ts"
      - "tests/whatsapp-composer.test.ts"
      - ".github/workflows/umraio-whatsapp-composer-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR merge candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Frozen dependency install
        run: bun install --frozen-lockfile

      - name: Composer regression suite
        run: bunx vitest run tests/whatsapp-composer.test.ts

      - name: WhatsApp Text focused regressions
        run: >-
          bunx vitest run
          tests/whatsapp-batch-p0-p1.test.ts
          tests/whatsapp-incident-reply-reliability.test.ts
          tests/whatsapp-composer.test.ts
          tests/whatsapp-webhook-security.test.ts
          tests/whatsapp-outbound-timeout.test.ts
          tests/p0-1-duplicate-suppression.test.ts

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Functional lint excluding pre-existing style debt
        run: >-
          bunx eslint
          src/lib/sales/whatsapp-composer.core.ts
          tests/whatsapp-composer.test.ts
          --rule 'prettier/prettier: off'
          --rule 'no-useless-escape: off'

      - name: Full regression suite
        run: bunx vitest run
