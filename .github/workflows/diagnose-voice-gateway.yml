name: Diagnose Voice Gateway

# Manual-only, read-only log retrieval for the UMRAIO voice gateway.
# Uses the existing repository Actions secret FLY_API_TOKEN (never printed).
# Outputs ONLY sanitized diagnostic lines for the target session and call
# window. Raw logs are never uploaded, never printed unfiltered.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-gateway-diagnostics
  cancel-in-progress: false

env:
  FLY_APP: umraio-voice-gateway
  TARGET_SESSION: "ms_862516e3fdca6b59845aa42f"
  TARGET_CALL_FRAGMENT: "IhggMDBCQzUxQkQ4NTU3REJFMUM5NTYwQUFENDUzRkQ5OEU"

jobs:
  diagnose:
    name: Retrieve sanitized gateway logs (sin)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Verify FLY_API_TOKEN is configured
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Repository secret FLY_API_TOKEN is missing."
            exit 1
          fi
          echo "FLY_API_TOKEN: present (value never printed)"

      - name: Install flyctl (latest stable)
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Confirm app state (no secrets)
        run: |
          set -euo pipefail
          flyctl status -a "$FLY_APP" || true
          flyctl ips list -a "$FLY_APP" || true

      - name: Retrieve logs and emit sanitized diagnostics only
        run: |
          set -euo pipefail
          RAW="$(mktemp)"
          trap 'rm -f "$RAW"' EXIT

          flyctl logs -a "$FLY_APP" --no-tail > "$RAW" || true
          echo "raw log lines captured: $(wc -l < "$RAW")"

          # Relevant, safe log keys emitted by the gateway. Raw SDP, ICE
          # credentials, DTLS fingerprints and tokens are never logged by the
          # gateway itself; the sed pass below is defence-in-depth.
          PATTERN='ms_862516e3fdca6b59845aa42f|'"$TARGET_CALL_FRAGMENT"'|media session created|media pipeline|ice gathering state|ice connection state|peer connection state|local answer generated|candidate_ipv4_count|candidate_ipv6_count|inbound audio track received|first inbound rtp|inbound rtp progress|first outbound opus|outbound opus progress|media ready|media session terminated|call terminated|udp mux|UDPMux|listening|mux|dtls|DTLS|ice_failed|peer_disconnected|inbound_rtp_closed'

          # Redact: phone numbers, other call IDs, IPv4/IPv6 literals, anything
          # resembling a token/credential. Keep enum/boolean/integer fields.
          grep -Ei "$PATTERN" "$RAW" \
            | sed -E \
                -e 's/[0-9]{10,15}/[PHONE]/g' \
                -e 's/wacid\.[A-Za-z0-9+\/=_-]+/wacid.[REDACTED]/g' \
                -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[IPv4]/g' \
                -e 's/([0-9a-fA-F]{0,4}:){2,}[0-9a-fA-F]{0,4}(%[a-z0-9]+)?/[IPv6]/g' \
                -e 's/(ufrag|pwd|fingerprint|token|secret|authorization)[=: ][^ ]+/[REDACTED]/gi' \
            || echo "(no matching diagnostic lines found)"

      - name: Diagnostics summary
        run: |
          {
            echo "### Voice gateway diagnostics (sanitized)"
            echo ""
            echo "- App: \`$FLY_APP\`"
            echo "- Target session: \`$TARGET_SESSION\`"
            echo "- Call window: 2026-09-03 09:28:55Z - 09:29:25Z"
            echo "- Raw logs: NOT uploaded, NOT printed unfiltered"
            echo "- FLY_API_TOKEN: never printed"
          } >> "$GITHUB_STEP_SUMMARY"
