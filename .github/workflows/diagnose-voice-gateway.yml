name: Diagnose Voice Gateway

# Manual-only, read-only log retrieval for the UMRAIO voice gateway.
# Uses the existing repository Actions secret FLY_API_TOKEN (never printed).
# Outputs ONLY sanitized diagnostic lines for the session and window supplied
# as workflow inputs. Raw logs are never uploaded, never printed unfiltered.

on:
  workflow_dispatch:
    inputs:
      gateway_session_id:
        description: "Gateway media session ID (e.g. ms_xxxxxxxxxxxx)"
        required: true
        type: string
      window_start:
        description: "Call window start, UTC (e.g. 2026-09-03T10:13:55Z)"
        required: true
        type: string
      window_end:
        description: "Call window end, UTC (e.g. 2026-09-03T10:14:30Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: voice-gateway-diagnostics
  cancel-in-progress: false

env:
  FLY_APP: umraio-voice-gateway

jobs:
  diagnose:
    name: Retrieve sanitized gateway logs (sin)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SESSION_ID: ${{ inputs.gateway_session_id }}
      WINDOW_START: ${{ inputs.window_start }}
      WINDOW_END: ${{ inputs.window_end }}

    steps:
      - name: Validate inputs and secret
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::Repository secret FLY_API_TOKEN is missing."
            exit 1
          fi
          echo "FLY_API_TOKEN: present (value never printed)"
          if ! [[ "$SESSION_ID" =~ ^ms_[a-f0-9]{8,64}$ ]]; then
            echo "::error::gateway_session_id must look like ms_<hex>."
            exit 1
          fi
          for v in "$WINDOW_START" "$WINDOW_END"; do
            if ! [[ "$v" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "::error::window_start/window_end must be UTC RFC3339, e.g. 2026-09-03T10:13:55Z"
              exit 1
            fi
          done
          echo "session: $SESSION_ID"
          echo "window: $WINDOW_START .. $WINDOW_END"

      - name: Install flyctl (latest stable)
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Confirm app state (no secrets)
        run: |
          set -euo pipefail
          flyctl status -a "$FLY_APP" || true
          flyctl ips list -a "$FLY_APP" || true

      - name: Retrieve logs and emit sanitized diagnostics only
        run: |
          set -euo pipefail
          RAW="$(mktemp)"
          WINDOWED="$(mktemp)"
          trap 'rm -f "$RAW" "$WINDOWED"' EXIT

          flyctl logs -a "$FLY_APP" --no-tail > "$RAW" || true
          echo "raw log lines captured: $(wc -l < "$RAW")"

          # Keep only lines whose leading ISO-8601 timestamp falls inside the
          # requested window; lines without a timestamp are kept only when they
          # mention the target session.
          START="$WINDOW_START" END="$WINDOW_END" SID="$SESSION_ID" \
          awk '{
            if (match($0, /[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}/)) {
              ts = substr($0, RSTART, RLENGTH) "Z";
              if (ts >= ENVIRON["START"] && ts <= ENVIRON["END"]) print;
            } else if (index($0, ENVIRON["SID"]) > 0) { print }
          }' "$RAW" > "$WINDOWED"
          echo "lines inside window: $(wc -l < "$WINDOWED")"

          # Relevant, safe log keys emitted by the gateway. Raw SDP, ICE
          # credentials, DTLS fingerprints and tokens are never logged by the
          # gateway itself; the sed pass below is defence-in-depth.
          PATTERN="$SESSION_ID"'|media session created|media pipeline|ice gathering state|ice connection state|peer connection state|selected candidate pair|candidate_ipv4_count|candidate_ipv6_count|dtls|DTLS|on_track|ontrack|inbound audio track received|first inbound rtp|first udp packet|inbound rtp progress|inbound_packets|outbound_packets|first outbound opus|outbound write|outbound opus progress|greeting|accepted|media ready|media_ready|media session terminated|call terminated|udp mux|UDPMux|listening|mux|ice_failed|peer_disconnected|inbound_rtp_closed'

          # Redact: phone numbers, call IDs, IPv4/IPv6 literals, anything
          # resembling a token/credential. Keep enum/boolean/integer fields.
          grep -Ei "$PATTERN" "$WINDOWED" \
            | sed -E \
                -e 's/[0-9]{10,15}/[PHONE]/g' \
                -e 's/wacid\.[A-Za-z0-9+\/=_-]+/wacid.[REDACTED]/g' \
                -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[IPv4]/g' \
                -e 's/([0-9a-fA-F]{0,4}:){2,}[0-9a-fA-F]{0,4}(%[a-z0-9]+)?/[IPv6]/g' \
                -e 's/(ufrag|pwd|fingerprint|token|secret|authorization)[=: ][^ ]+/[REDACTED]/gi' \
            || echo "(no matching diagnostic lines found)"

      - name: Diagnostics summary
        run: |
          {
            echo "### Voice gateway diagnostics (sanitized)"
            echo ""
            echo "- App: \`$FLY_APP\`"
            echo "- Target session: \`$SESSION_ID\`"
            echo "- Call window: \`$WINDOW_START\` - \`$WINDOW_END\`"
            echo "- Raw logs: NOT uploaded, NOT printed unfiltered"
            echo "- FLY_API_TOKEN: never printed"
          } >> "$GITHUB_STEP_SUMMARY"
