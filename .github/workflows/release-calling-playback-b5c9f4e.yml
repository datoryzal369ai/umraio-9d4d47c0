name: Controlled gateway-only qualified interruption release f3e3b3c

on:
  push:
    branches: [codex/release-calling-qualified-f3e3b3c]

permissions:
  contents: read
  actions: read

concurrency:
  group: voice-gateway-production-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/codex/release-calling-qualified-f3e3b3c'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE: f3e3b3c7cd371a41c0ed739bf9e5a7a7f402bf85
      ROLLBACK_IMAGE: registry.fly.io/umraio-voice-gateway@sha256:6b7820b5523eb4e78c2027277f793623b9e3993da6716ece96084c4200dc9dad
      CANDIDATE_IMAGE: registry.fly.io/umraio-voice-gateway:qualified-f3e3b3c7cd371a41c0ed739bf9e5a7a7f402bf85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: release-driver
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f3e3b3c7cd371a41c0ed739bf9e5a7a7f402bf85
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source matches completed qualification validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-driver/scripts/release-calling-playback-b5c9f4e.py source
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.101
      - name: Verify unchanged Worker and gateway, zero sessions and preserve rollback
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python3 release-driver/scripts/release-calling-playback-b5c9f4e.py preflight
      - name: Retrieve and verify exact previous production rollback image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker >/dev/null
          docker pull "$ROLLBACK_IMAGE"
          python3 release-driver/scripts/release-calling-playback-b5c9f4e.py rollback-image
      - name: Verify deployment state and retrievable rollback before release
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 release-driver/scripts/preflight-qualified-interruption.py
      - name: Reuse existing exact candidate or package it once if absent
        run: python3 release-driver/scripts/prepare-qualified-image.py
      - name: Release image only with zero-session guard and automatic rollback
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python3 release-driver/scripts/release-calling-playback-b5c9f4e.py release
      - name: Confirm source unchanged and Worker publication untouched
        run: |
          git -C candidate diff --exit-code
          git -C release-driver diff --exit-code
          echo 'Exact gateway-only release. Worker publication, secrets and network configuration untouched. Founder acceptance pending.'
      - name: Verify baseline rollback remains retrievable after release
        run: |
          docker pull "$ROLLBACK_IMAGE"
          python3 release-driver/scripts/release-calling-playback-b5c9f4e.py rollback-image
