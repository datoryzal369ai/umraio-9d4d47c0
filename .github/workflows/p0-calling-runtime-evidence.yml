name: P0 founder Calling runtime evidence
on:
  push:
    branches: [codex/p0-calling-secure-release-20260909]
    paths: [.github/workflows/p0-calling-runtime-evidence.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Set up existing Fly client
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: latest
      - name: Read only the founder call runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, urllib.request
          call_id='wacid.IhggMDBBODdENEQ5RjFBNzU4REZEMzUwODlDOTY2NEZFNTccGAw2MDExMTA2Mzk5OTYVAgAVAgA='
          result=subprocess.run(['flyctl','logs','--app','umraio-voice-gateway','--json','--no-tail'],capture_output=True,timeout=60)
          if result.returncode:
              raise SystemExit('Read-only Fly log fetch failed; output suppressed')
          allowed={'time','level','msg','call_id','state','reason','inbound_packets','outbound_packets','sequence','error_class','http_status','duration_ms','tts_ms','tts_encode_ms','playback_start_ms','speech_end_to_first_audio_ms','packets','greeting','event','error'}
          matches=[]
          def consider(row):
              if not isinstance(row,dict):return
              if row.get('call_id')==call_id:
                  safe={k:v for k,v in row.items() if k in allowed and isinstance(v,(str,int,float,bool))}
                  matches.append(safe)
              for k in ['message','msg','data']:
                  v=row.get(k)
                  if isinstance(v,dict):consider(v)
                  elif isinstance(v,str) and call_id in v:
                      pos=v.find('{')
                      if pos>=0:
                          try:consider(json.loads(v[pos:]))
                          except ValueError:pass
          for line in result.stdout.decode(errors='replace').splitlines():
              try:consider(json.loads(line))
              except ValueError:pass
          print(json.dumps({'scope':'ONE_REAL_FOUNDER_CALL_ONLY','events':matches,'matching_events':len(matches),'mutations':0}))
          with urllib.request.urlopen('https://umraio-voice-gateway.fly.dev/health',timeout=15) as r:
              h=json.load(r)
          print(json.dumps({'runtime':{k:h.get(k) for k in ['status','build_version','webrtc','speech','active_sessions']}}))
          PY
