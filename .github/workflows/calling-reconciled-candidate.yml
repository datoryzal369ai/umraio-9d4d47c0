name: Reconciled Calling humanization and diagnostics gates

# Candidate validation only: no deployment, production credentials or service calls.
on:
  push:
    branches: [codex/calling-reconciled-a7f6533-20260909]

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/codex/calling-reconciled-a7f6533-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      BASELINE: a7f653372aaaa5e80e2b9f9c7e6c0b53d380b93c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact reconciliation, protected media and rollback
        run: |
          python3 - <<'PYGUARD'
          import os, subprocess
          base = os.environ['BASELINE']
          allowed = {
            '.github/workflows/calling-reconciled-candidate.yml',
            'src/lib/calls/call-backchannel.core.ts',
            'src/lib/calls/call-stream.server.ts',
            'src/lib/calls/call-experience.core.ts',
            'src/lib/calls/cognitive-router.core.ts',
            'src/lib/calls/voice-turn.core.ts',
            'src/lib/calls/voice-turn.server.ts',
            'src/routes/api/public/voice/turn.ts',
            'tests/call-explicit-hangup.test.ts',
            'tests/calling-human-quality.test.ts',
            'tests/calling-farewell-commit.test.ts',
            'tests/voice-realtime-experience.test.ts',
            'voice-gateway/internal/callback/turn.go',
            'voice-gateway/internal/callback/turn_stream_test.go',
            'voice-gateway/internal/media/conversation.go',
            'voice-gateway/internal/media/conversation_control.go',
            'voice-gateway/internal/media/conversation_control_test.go',
            'voice-gateway/internal/webrtc/conversation_termination_test.go',
          }
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('merge-base',base,'HEAD') == base, 'Candidate not based on deployed diagnostic SHA'
          changed = set(git('diff','--name-only',base,'HEAD').splitlines())
          assert changed <= allowed, 'Protected path changed: ' + repr(sorted(changed-allowed))
          for ref, sha in {
            'origin/main': '5a99d0166560afc8c0cfa9c9bb3171105e3f7ec6',
            'origin/rollback/p0-calling-human-quality-5a99d01-20260909': '5a99d0166560afc8c0cfa9c9bb3171105e3f7ec6',
            'origin/codex/calling-human-quality-isolated-20260909': 'c6d025a88f988974b7be3876226d12db31bed4e4',
            'origin/codex/calling-ice-diagnostics-20260909': base,
          }.items():
            assert git('rev-parse',ref) == sha, 'Protected ref moved: '+ref
          # Every runtime WebRTC/ICE/STUN/DTLS/RTP byte remains production's.
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--','voice-gateway/internal/webrtc',':(exclude)voice-gateway/internal/webrtc/conversation_termination_test.go'],check=True)
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--','voice-gateway/internal/media',':(exclude)voice-gateway/internal/media/conversation.go',':(exclude)voice-gateway/internal/media/conversation_control.go',':(exclude)voice-gateway/internal/media/conversation_control_test.go'],check=True)
          subprocess.run(['git','diff','--check',base,'HEAD'],check=True)
          print('PASS: diagnostics, Voice Note, MiniMax, codec, RTP, ICE, networking, secrets/config and Text source unchanged.')
          print('PASS: working production refs and rollback preserved.')
          print('Exact changed paths:\n'+'\n'.join(sorted(changed)))
          PYGUARD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: voice-gateway/go.mod
          cache-dependency-path: voice-gateway/go.sum
      - name: Install test-only tooling and frozen application dependencies
        id: install
        run: |
          npm install --prefix "$RUNNER_TEMP/calling-tools" --ignore-scripts --no-audit --no-fund bun@1.3.10 vitest@4.0.18 @typescript/native-preview@7.0.0-dev.20260707.2
          node "$RUNNER_TEMP/calling-tools/node_modules/bun/install.js"
          "$RUNNER_TEMP/calling-tools/node_modules/.bin/bun" install --frozen-lockfile --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev libogg-dev ffmpeg
      - name: Farewell ownership, caller resumption and real PeerConnection closure, twenty repetitions with race detection
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: voice-gateway
        run: go test -race -v ./internal/media ./internal/webrtc -run 'TestConversationCandidateFarewellFinishesAndSelfCloseDoesNotDeadlock|TestConversationCandidateInterruptedFarewellDoesNotHangUp|TestConversationCandidateThreeTurnsThenNaturalClose|TestConversationCompleteClosesPeerAfterFarewellAndEmitsCallback' -count=20 -timeout=180s
      - name: Focused ICE diagnostics and existing WebRTC diagnostics with race detector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: voice-gateway
        run: go test -race -v ./internal/webrtc -run 'TestICE|TestMediaDiagnosticsEndToEnd|TestEngineDiagnosticsAreSafe' -count=5 -timeout=180s
      - name: Full native media, conversation, MiniMax, Opus, RTP, VAD and WebRTC regression gates
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: voice-gateway
        run: go test -race -v ./... -count=1 -timeout=180s
      - name: Calling, Voice Note and WhatsApp Text regression gates
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          prefixes = ('voice-', 'call-', 'calling-', 'minimax-', 'opus-', 'whatsapp-voice')
          extra = {
            'gateway-run-text.test.ts', 'whatsapp-webhook-security.test.ts',
            'whatsapp-coalescing-identity.test.ts', 'whatsapp-conversational-guard.test.ts',
            'whatsapp-outbound-timeout.test.ts', 'console-outbound-text-voice.test.ts', 'whatsapp-composer.test.ts',
            'whatsapp-inbound-calls-v1.test.ts', 'whatsapp-calling-pre-accept-p0.test.ts',
          }
          files = sorted(str(p) for p in pathlib.Path('tests').glob('*.test.ts') if p.name.startswith(prefixes) or p.name in extra)
          runner = os.environ['RUNNER_TEMP'] + '/calling-tools/node_modules/.bin/vitest'
          subprocess.run([runner, 'run', '--reporter=default', '--reporter=json', '--outputFile.json=calling-test-results.json', *files], check=True)
          PY
      - name: Repeated completion and farewell guard regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          for iteration in $(seq 1 20); do
            "$RUNNER_TEMP/calling-tools/node_modules/.bin/vitest" run tests/calling-farewell-commit.test.ts tests/call-explicit-hangup.test.ts tests/calling-human-quality.test.ts --reporter=dot > "$RUNNER_TEMP/farewell-repeat.log" 2>&1 || { cat "$RUNNER_TEMP/farewell-repeat.log"; exit 1; }
          done
          cat "$RUNNER_TEMP/farewell-repeat.log"
          echo 'PASS: twenty consecutive completion/backchannel/commit suites.'
      - name: Typecheck, app build and native build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/calling-tools/node_modules/.bin/tsgo" --noEmit
          npm run build > "$RUNNER_TEMP/calling-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/calling-build.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/calling-build.log"
          cd voice-gateway
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/calling-gateway" ./cmd/gateway
      - name: Verify validation left protected source and dependency locks untouched
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          git diff --exit-code
          echo 'PASS: tracked source unchanged by tests; overall release readiness also requires every preceding gate to pass.'
