name: UMRAIO authorized single MiniMax synthesis - NO DEPLOY
'on':
  push:
    branches:
    - codex/umraio-p0-validation-runner-20260908
    paths:
    - .github/workflows/umraio-p0-frozen-validation.yml
permissions:
  contents: read
concurrency:
  group: umraio-single-tts-diagnostic
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 4633749b5d66cf1dc9417384934e6e2d95a9ed66
        persist-credentials: false
    - uses: superfly/flyctl-actions/setup-flyctl@master
      with:
        version: 0.4.100
    - name: Materialize approved diagnostic outside candidate
      shell: python
      run: |
        import base64,hashlib,os,pathlib
        payload=base64.b64decode('')
        assert hashlib.sha256(payload).hexdigest()=='c1ab4f8c2d87b12defe6229ff10e3de67af1f4595ceb860a2ab3620962e667ba'
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'umraio-single-tts-diagnostic.py'
        assert not p.exists()
        p.write_bytes(payload)
    - name: Run exactly one authorized MiniMax synthesis; no retry
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        REPO_MINIMAX_TTS_API_KEY: ${{ secrets.MINIMAX_TTS_API_KEY }}
        UMRAIO_APPROVED_SINGLE_TTS_DIAGNOSTIC: 'YES'
      run: python3 "$RUNNER_TEMP/umraio-single-tts-diagnostic.py"
    - name: Preserve non-secret metadata evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: umraio-single-tts-${{ github.run_id }}
        path: ${{ runner.temp }}/umraio-single-tts-diagnostic/report.json
        retention-days: 14
        if-no-files-found: error
    - name: Scoped temporary cleanup
      if: always()
      shell: python
      run: |
        import os,pathlib,shutil
        root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
        for name in ['umraio-single-tts-diagnostic','umraio-single-tts-diagnostic.py']:
         p=root/name
         assert p.parent==root
         if p.is_dir(): shutil.rmtree(p)
         elif p.exists(): p.unlink()
        import subprocess,json
        root_checkout=os.environ["GITHUB_WORKSPACE"]
        head=subprocess.check_output(["git","-C",root_checkout,"rev-parse","HEAD"],text=True).strip()
        status=subprocess.check_output(["git","-C",root_checkout,"status","--porcelain=v1","--untracked-files=all"],text=True).strip()
        print(json.dumps({"checkout_after_cleanup":{"head":head,"status":status}}))
        assert head=="4633749b5d66cf1dc9417384934e6e2d95a9ed66" and not status
