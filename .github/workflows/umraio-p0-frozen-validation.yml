name: UMRAIO P0 isolated SQL security validation

on:
  push:
    branches:
      - codex/umraio-p0-validation-runner-20260908
    paths:
      - .github/workflows/umraio-p0-frozen-validation.yml

permissions:
  contents: read

concurrency:
  group: umraio-p0-isolated-sql-once-4633749
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 4633749b5d66cf1dc9417384934e6e2d95a9ed66

jobs:
  sql-security:
    name: One isolated SQL bootstrap and ten original checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require first attempt
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v4
        with:
          ref: 4633749b5d66cf1dc9417384934e6e2d95a9ed66
          fetch-depth: 1
          persist-credentials: false
      - name: Verify frozen test subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize approved runner payload
        shell: python
        run: |
          import base64,hashlib,io,os,pathlib,zipfile
          payload=base64.b64decode('')
          assert hashlib.sha256(payload).hexdigest() == 'f9240b99ae6ace059d421ee7d6c4963845e56e567dcfebbdf38d787ab740153a'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'umraio-sql-approved-package'
          target.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              assert all('/' not in n and '..' not in n for n in z.namelist())
              z.extractall(target)
          print('Approved SQL package materialized; original DDL and test hashes will be verified before execution.')
      - name: Install pinned isolated tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/umraio-sql-tools" --no-save --no-package-lock vitest@5.0.0 supabase@2.117.0
          echo "$RUNNER_TEMP/umraio-sql-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Bootstrap once, run ten checks once, and perform scoped teardown
        shell: bash
        env:
          UMRAIO_REPO: ${{ github.workspace }}
          UMRAIO_SQL_PACKAGE: ${{ runner.temp }}/umraio-sql-approved-package
          UMRAIO_VITEST_ENTRY: ${{ runner.temp }}/umraio-sql-tools/node_modules/vitest/vitest.mjs
        run: python3 "$UMRAIO_SQL_PACKAGE/run_once.py"
      - name: Verify candidate unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git diff --exit-code "$CANDIDATE_SHA"
      - name: Preserve first execution evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umraio-sql-once-4633749
          path: ${{ runner.temp }}/umraio-sql-evidence/
          if-no-files-found: warn
          retention-days: 14
