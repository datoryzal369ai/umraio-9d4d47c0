# Approved preparation only. No deployment, production secret writes, DB bootstrap or customer traffic.
name: UMRAIO P0 artifact preparation - NO DEPLOY
'on':
  push:
    branches:
    - codex/umraio-p0-validation-runner-20260908
    paths:
    - .github/workflows/umraio-p0-frozen-validation.yml
permissions:
  contents: read
concurrency:
  group: umraio-p0-artifact-preparation-4633749
  cancel-in-progress: false
jobs:
  build:
    name: Read preflight and build push candidate only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      candidate_digest: ${{ steps.prepare.outputs.candidate_digest }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 4633749b5d66cf1dc9417384934e6e2d95a9ed66
        persist-credentials: false
    - uses: superfly/flyctl-actions/setup-flyctl@master
      with:
        version: 0.4.100
    - name: Materialize reviewed runner outside candidate
      shell: python
      run: |
        import base64,hashlib,os,pathlib
        payload=base64.b64decode('')
        assert hashlib.sha256(payload).hexdigest()=='d047bf15d9d6be921e7dbe091555c20888fb051584d2c1c3f2077426fb31fee4'
        target=pathlib.Path(os.environ['RUNNER_TEMP'])/'umraio-artifact-runner.py'
        assert not target.exists()
        target.write_bytes(payload)
    - name: Approved metadata and artifact preparation
      id: prepare
      shell: bash
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        PREPARATION_MODE: build
        REPO_MINIMAX_TTS_API_KEY: ${{ secrets.MINIMAX_TTS_API_KEY }}
        REPO_MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      run: python3 "$RUNNER_TEMP/umraio-artifact-runner.py"
    - name: Preserve non-secret evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: umraio-p0-artifact-build-${{ github.run_id }}
        path: ${{ runner.temp }}/umraio-artifact-preparation/evidence/
        retention-days: 14
        if-no-files-found: error
    - name: Scoped temporary authentication and evidence cleanup
      if: always()
      shell: python
      run: |
        import os,pathlib,shutil
        root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
        for name in ['umraio-artifact-preparation','umraio-artifact-runner.py']:
            p=root/name
            assert p.parent==root and not p.is_symlink()
            if p.is_dir():shutil.rmtree(p)
            elif p.is_file():p.unlink()
        print('Only this preparation run temporary files removed; no production cleanup.')
  verify:
    name: Retrieve exact candidate on a fresh runner
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 4633749b5d66cf1dc9417384934e6e2d95a9ed66
        persist-credentials: false
    - uses: superfly/flyctl-actions/setup-flyctl@master
      with:
        version: 0.4.100
    - name: Materialize reviewed runner outside candidate
      shell: python
      run: |
        import base64,hashlib,os,pathlib
        payload=base64.b64decode('')
        assert hashlib.sha256(payload).hexdigest()=='d047bf15d9d6be921e7dbe091555c20888fb051584d2c1c3f2077426fb31fee4'
        target=pathlib.Path(os.environ['RUNNER_TEMP'])/'umraio-artifact-runner.py'
        assert not target.exists()
        target.write_bytes(payload)
    - name: Fresh runner immutable artifact retrieval
      id: prepare
      shell: bash
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        PREPARATION_MODE: verify
        CANDIDATE_IMAGE_DIGEST: ${{ needs.build.outputs.candidate_digest }}
      run: python3 "$RUNNER_TEMP/umraio-artifact-runner.py"
    - name: Preserve non-secret evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: umraio-p0-artifact-verify-${{ github.run_id }}
        path: ${{ runner.temp }}/umraio-artifact-preparation/evidence/
        retention-days: 14
        if-no-files-found: error
    - name: Scoped temporary authentication and evidence cleanup
      if: always()
      shell: python
      run: |
        import os,pathlib,shutil
        root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
        for name in ['umraio-artifact-preparation','umraio-artifact-runner.py']:
            p=root/name
            assert p.parent==root and not p.is_symlink()
            if p.is_dir():shutil.rmtree(p)
            elif p.is_file():p.unlink()
        print('Only this preparation run temporary files removed; no production cleanup.')
