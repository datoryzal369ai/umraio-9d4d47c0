name: UMRAIO P0 isolated SQL second controlled attempt

on:
  push:
    branches:
      - codex/umraio-p0-validation-runner-20260908
    paths:
      - .github/workflows/umraio-p0-frozen-validation.yml

permissions:
  contents: read

concurrency:
  group: umraio-p0-isolated-sql-second-4633749
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 4633749b5d66cf1dc9417384934e6e2d95a9ed66

jobs:
  sql-security:
    name: Second authorized SQL bootstrap and ten original checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prohibit reruns of this second-attempt workflow
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v4
        with:
          ref: 4633749b5d66cf1dc9417384934e6e2d95a9ed66
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact initial checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/umraio-sql-second-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/umraio-sql-second-evidence/initial-head.txt"
          git status --porcelain=v1 --untracked-files=all | tee "$RUNNER_TEMP/umraio-sql-second-evidence/initial-status.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/umraio-sql-second-evidence/initial-status.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize reviewed second-attempt runner payload
        shell: python
        run: |
          import base64,hashlib,io,os,pathlib,zipfile
          payload=base64.b64decode('')
          assert hashlib.sha256(payload).hexdigest() == '5169e25d5b4133f398eecd02e686127bf47efb3ae9500b68a6d4e75caeafb3e0'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'umraio-sql-second-package'
          target.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              assert all('/' not in n and '..' not in n for n in z.namelist())
              z.extractall(target)
      - name: Install pinned tooling entirely outside candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/umraio-sql-second-tools"
          cd "$RUNNER_TEMP/umraio-sql-second-tools"
          npm install --no-save --no-package-lock vitest@5.0.0 supabase@2.117.0
          git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all | tee "$RUNNER_TEMP/umraio-sql-second-evidence/after-tool-install-status.txt"
          test ! -s "$RUNNER_TEMP/umraio-sql-second-evidence/after-tool-install-status.txt"
      - name: Bootstrap once, execute original checks once, diagnose and clean scoped resources
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python3 "$RUNNER_TEMP/umraio-sql-second-package/run_second_once.py"
      - name: Record and enforce final checkout integrity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/umraio-sql-second-evidence/final-head.txt"
          git status --porcelain=v1 --untracked-files=all | tee "$RUNNER_TEMP/umraio-sql-second-evidence/final-status.txt"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test ! -s "$RUNNER_TEMP/umraio-sql-second-evidence/final-status.txt"
          git diff --check
      - name: Preserve second-attempt evidence
        id: evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umraio-sql-second-4633749
          path: ${{ runner.temp }}/umraio-sql-second-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this attempt's tooling and payload directories
        if: always()
        shell: python
        run: |
          import os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          for name in ['umraio-sql-second-tools','umraio-sql-second-package']:
              target=root/name
              assert target.parent == root and not target.is_symlink()
              if target.exists(): shutil.rmtree(target)
          print('Scoped tooling and payload cleanup complete.')
