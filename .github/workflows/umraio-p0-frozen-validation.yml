name: UMRAIO P0 race fixture follow-up validation

on:
  push:
    branches:
      - codex/umraio-p0-validation-runner-20260908
    paths:
      - .github/workflows/umraio-p0-frozen-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umraio-p0-frozen-validation-20260908
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 4633749b5d66cf1dc9417384934e6e2d95a9ed66
  FROZEN_SHA: 1f18df31c7df1ed87146bbf504ccb1bd357a11f0

jobs:
  go:
    name: Go ${{ matrix.mode }} at follow-up SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [full, race]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4633749b5d66cf1dc9417384934e6e2d95a9ed66
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and one-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$FROZEN_SHA" HEAD
          test "$(git diff --name-only "$FROZEN_SHA" HEAD)" = 'voice-gateway/internal/webrtc/media_diagnostics_test.go'
          git rev-parse HEAD
      - uses: actions/setup-go@v5
        with:
          go-version-file: voice-gateway/go.mod
          cache-dependency-path: voice-gateway/go.sum
      - name: Install native Opus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev libogg-dev
      - name: Run every Go test
        working-directory: voice-gateway
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOFLAGS: '-json'
          TEST_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [ "$TEST_MODE" = race ]; then
            go test -race -count=1 ./... | tee "$GITHUB_WORKSPACE/go-race.jsonl"
          else
            go test -count=1 ./... | tee "$GITHUB_WORKSPACE/go-full.jsonl"
          fi
      - name: Record exact test results
        if: always()
        shell: python
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          import collections, json, os, pathlib
          names = '''TestAcceptedIsIdempotentForLiveSession
          TestEngineDiagnosticsAreSafe
          TestAnswerAdvertisesBothCandidateFamilies
          TestOfferRequiresRequestSignature
          TestOfferRejectsExpiredToken
          TestOfferRejectsCallIDMismatch
          TestOfferSucceedsAndDoesNotClaimMediaReady
          TestOfferReplayIsRejected
          TestConcurrentSessionLimitEnforced
          TestTerminateEndsSessionAndEmitsEvent
          TestLoopbackNegotiatesOpusAndReachesMediaReady
          TestTerminateIsIdempotentAndClosesPipeline
          TestMediaDiagnosticsEndToEnd
          TestNegotiationBindsInboundAudioPath
          TestInboundRTPDrivesMediaReady
          TestSetRemoteDescriptionAcceptsNormalizedOffer'''.split()
          source = pathlib.Path('go-' + os.environ['TEST_MODE'] + '.jsonl')
          events = [json.loads(line) for line in source.read_text().splitlines()] if source.exists() else []
          results = {e['Test']: e['Action'] for e in events if e.get('Test') and e['Action'] in ('pass', 'fail', 'skip')}
          counts = collections.Counter(result for name, result in results.items() if '/' not in name)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('Tested SHA: `' + os.environ['CANDIDATE_SHA'] + '`\n\n')
            summary.write('Top-level tests: ' + json.dumps(dict(counts)) + '\n\n')
            summary.write('| Required integration test | Result |\n|---|---|\n')
            for name in names:
              result = results.get(name, 'NOT EXECUTED')
              print(name + ': ' + result)
              summary.write('| `' + name + '` | ' + result + ' |\n')
          if any(results.get(name) != 'pass' for name in names):
            raise SystemExit('One or more required tests did not pass.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umraio-p0-followup-${{ matrix.mode }}-4633749
          path: go-${{ matrix.mode }}.jsonl
          if-no-files-found: warn
          retention-days: 14

  repeated-race-and-vet:
    name: Repeated race, vet and preservation checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4633749b5d66cf1dc9417384934e6e2d95a9ed66
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: voice-gateway/go.mod
          cache-dependency-path: voice-gateway/go.sum
      - name: Verify source, formatting and unchanged assertions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$FROZEN_SHA" HEAD)" = 'voice-gateway/internal/webrtc/media_diagnostics_test.go'
          test -z "$(gofmt -l voice-gateway/internal/webrtc/media_diagnostics_test.go)"
          git diff --check "$FROZEN_SHA" HEAD
          python3 - <<'PY'
          import os, pathlib, subprocess
          path = 'voice-gateway/internal/webrtc/media_diagnostics_test.go'
          old = subprocess.check_output(['git', 'show', os.environ['FROZEN_SHA'] + ':' + path], text=True)
          new = pathlib.Path(path).read_text()
          marker = 'func TestMediaDiagnosticsEndToEnd'
          assert new[new.index(marker):].replace('buf := &diagnosticLogBuffer{}', 'buf := &bytes.Buffer{}') == old[old.index(marker):]
          print('Original test assertions unchanged; production source unchanged.')
          PY
      - name: Install native Opus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev libogg-dev
      - name: Go vet
        working-directory: voice-gateway
        env:
          CGO_ENABLED: '1'
        run: go vet ./...
      - name: Repeat repaired test under race detector twenty times
        working-directory: voice-gateway
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          go test -race -count=20 -json -run '^TestMediaDiagnosticsEndToEnd$' ./internal/webrtc | tee "$GITHUB_WORKSPACE/go-repeated-race.jsonl"
      - name: Verify all twenty executions passed
        if: always()
        shell: python
        run: |
          import collections, json, os, pathlib
          p = pathlib.Path('go-repeated-race.jsonl')
          events = [json.loads(line) for line in p.read_text().splitlines()] if p.exists() else []
          counts = collections.Counter(e['Action'] for e in events if e.get('Test') == 'TestMediaDiagnosticsEndToEnd' and e['Action'] in ('pass', 'fail', 'skip'))
          print(dict(counts))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('Tested SHA: `' + os.environ['CANDIDATE_SHA'] + '`\n\nRepeated race: ' + json.dumps(dict(counts)) + '\n')
          assert counts['pass'] == 20 and counts['fail'] == 0 and counts['skip'] == 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umraio-p0-followup-repeated-race-4633749
          path: go-repeated-race.jsonl
          if-no-files-found: warn
          retention-days: 14
