name: UMRAIO MiniMax read-only credential metadata - NO DEPLOY
'on':
  push:
    branches:
    - codex/umraio-p0-validation-runner-20260908
    paths:
    - .github/workflows/umraio-p0-frozen-validation.yml
permissions:
  contents: read
concurrency:
  group: umraio-minimax-readonly
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 4633749b5d66cf1dc9417384934e6e2d95a9ed66
        persist-credentials: false
    - uses: superfly/flyctl-actions/setup-flyctl@master
      with:
        version: 0.4.100
    - name: Materialize reviewed read-only runner outside candidate
      shell: python
      run: |
        import base64,hashlib,os,pathlib
        payload=base64.b64decode('')
        assert hashlib.sha256(payload).hexdigest()=='9357589838c5f0b0040ec2b58379a1a467d681791d2744874521b34c50a6f1ff'
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'umraio-minimax-readonly.py'
        assert not p.exists()
        p.write_bytes(payload)
    - name: Read current credential fingerprint and provider usage metadata once
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        REPO_MINIMAX_TTS_API_KEY: ${{ secrets.MINIMAX_TTS_API_KEY }}
      run: python3 "$RUNNER_TEMP/umraio-minimax-readonly.py"
    - name: Preserve non-secret metadata evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: umraio-minimax-readonly-${{ github.run_id }}
        path: ${{ runner.temp }}/umraio-minimax-readonly/report.json
        retention-days: 14
        if-no-files-found: error
    - name: Scoped temporary cleanup
      if: always()
      shell: python
      run: |
        import os,pathlib,shutil
        root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
        for name in ['umraio-minimax-readonly','umraio-minimax-readonly.py']:
         p=root/name
         assert p.parent==root
         if p.is_dir(): shutil.rmtree(p)
         elif p.exists(): p.unlink()
