name: UMRAIO P0 retained artifact failure inspection
on:
  push:
    branches: [codex/umraio-p0-validation-runner-20260908]
    paths: [.github/workflows/umraio-p0-frozen-validation.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: umraio-p0-artifact-build-34212758398
          run-id: 34212758398
          repository: datoryzal369ai/umraio-9d4d47c0
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/umraio-retained-build-inspection
      - name: Display retained first failure and safe metadata without rerunning build
        shell: python
        run: |
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'umraio-retained-build-inspection'
          report=json.loads((root/'report.json').read_text())
          for key in ['first_failure','repository_credential_metadata','gateway_runtime_fingerprint','gateway_matches_repository_tts_raw_fingerprint','gateway_retained_tts_logs','machines_before','machines_after','fly_before','releases_before','rollback_artifact','checkout_before','checkout_after']:
              print(json.dumps({key:report.get(key)}))
          print('PRESERVED_BUILD_LOG_START')
          lines=(root/'candidate-build.log').read_text().splitlines()
          print('\n'.join(lines[-180:]))
          print('PRESERVED_BUILD_LOG_END')
      - name: Scoped read artifact cleanup
        if: always()
        shell: python
        run: |
          import os,pathlib,shutil
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'umraio-retained-build-inspection'
          if target.is_dir():shutil.rmtree(target)
