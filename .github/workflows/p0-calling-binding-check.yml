name: P0 Calling deployment binding check

on:
  push:
    branches: [codex/p0-calling-binding-check-20260909]
    paths: [.github/workflows/p0-calling-binding-check.yml]

permissions:
  contents: read

concurrency:
  group: p0-calling-binding-check-20260909
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MINIMAX_TTS_API_KEY: ${{ secrets.MINIMAX_TTS_API_KEY }}
    steps:
      - name: Check the current Calling deployment credential without changing bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          key = os.environ.get('MINIMAX_TTS_API_KEY', '').strip()
          report = {'scope': 'Calling GitHub deployment binding only', 'model': 'speech-2.8-hd', 'voice_id': 'Malay_male_1_v1', 'secrets_changed': False, 'deployed': False, 'builds_run': 0, 'voice_note_tested': False}
          def finish(ok, reason):
              report.update({'credential_synthesis': 'PASS' if ok else 'FAIL', 'reason': reason})
              print(json.dumps(report, sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write(json.dumps(report, indent=2) + '\n')
              sys.exit(0 if ok else 1)
          if not key:
              finish(False, 'GitHub Actions MINIMAX_TTS_API_KEY is missing')
          body = {'model': 'speech-2.8-hd', 'text': 'Assalamualaikum Datuk.', 'stream': False, 'language_boost': 'Malay', 'output_format': 'hex', 'voice_setting': {'voice_id': 'Malay_male_1_v1', 'speed': 1, 'vol': 1, 'pitch': 0}, 'audio_setting': {'sample_rate': 24000, 'bitrate': 128000, 'format': 'pcm', 'channel': 1}}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request('https://api.minimax.io/v1/t2a_v2', data=json.dumps(body).encode(), method='POST', headers={'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json'})
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=25) as response:
                  report['http_status'] = response.status
                  raw = response.read((32 << 20) + 1)
          except urllib.error.HTTPError as error:
              report['http_status'] = error.code
              finish(False, 'MiniMax HTTP rejection')
          except Exception:
              finish(False, 'MiniMax transport failure')
          if len(raw) > (32 << 20):
              finish(False, 'MiniMax response exceeded runtime limit')
          try:
              result = json.loads(raw)
              code = result.get('base_resp', {}).get('status_code')
              report['provider_status_code'] = code if isinstance(code, int) else None
              if code != 0:
                  finish(False, 'MiniMax rejected the current GitHub Calling deployment credential')
              pcm = bytes.fromhex(result.get('data', {}).get('audio', ''))
          except (ValueError, TypeError, AttributeError):
              finish(False, 'MiniMax returned invalid PCM data')
          if len(pcm) < 2 or len(pcm) % 2 or not any(pcm):
              finish(False, 'MiniMax returned empty, silent or malformed PCM')
          report['pcm_bytes'] = len(pcm)
          report['sample_rate'] = 24000
          report['channels'] = 1
          finish(True, 'Current GitHub Calling deployment credential synthesized nonzero PCM')
          PY
