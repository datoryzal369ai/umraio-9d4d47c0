name: P0 Calling credential rollback preservation

on:
  push:
    branches: [codex/p0-calling-binding-check-20260909]
    paths: [.github/workflows/p0-calling-credential-rollback.yml]

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Seal the existing GitHub Calling binding without exposing it
        shell: bash
        env:
          MINIMAX_TTS_API_KEY: ${{ secrets.MINIMAX_TTS_API_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          node <<'JS'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const original = process.env.MINIMAX_TTS_API_KEY;
          const wrapping = process.env.FLY_API_TOKEN;
          if (!original || !wrapping) throw new Error('Required existing secure binding unavailable; nothing changed');
          const salt = crypto.randomBytes(32);
          const nonce = crypto.randomBytes(12);
          const context = 'UMRAIO-P0-CALLING-GITHUB-ROLLBACK-v1';
          const key = Buffer.from(crypto.hkdfSync('sha256', Buffer.from(wrapping), salt, Buffer.from(context), 32));
          const aadObject = {version: 1, repository: process.env.GITHUB_REPOSITORY, secret_name: 'MINIMAX_TTS_API_KEY', source: 'GitHub Actions repository binding', source_checkpoint: '336242aef606cfbfd7a214922858768d510a63fb', created_at: new Date().toISOString(), workflow_run: process.env.GITHUB_RUN_ID};
          const aad = Buffer.from(JSON.stringify(aadObject));
          const plaintext = Buffer.from(original);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, nonce);
          cipher.setAAD(aad);
          const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()]);
          const tag = cipher.getAuthTag();
          const decipher = crypto.createDecipheriv('aes-256-gcm', key, nonce);
          decipher.setAAD(aad);
          decipher.setAuthTag(tag);
          const restored = Buffer.concat([decipher.update(ciphertext), decipher.final()]);
          if (!crypto.timingSafeEqual(restored, plaintext)) throw new Error('Credential rollback recovery check failed');
          const envelope = {algorithm: 'AES-256-GCM', kdf: 'HKDF-SHA256', wrapping_binding: 'existing unchanged GitHub FLY_API_TOKEN', context, salt_base64: salt.toString('base64'), nonce_base64: nonce.toString('base64'), aad_base64: aad.toString('base64'), ciphertext_base64: ciphertext.toString('base64'), tag_base64: tag.toString('base64')};
          const destination = path.join(process.env.RUNNER_TEMP, 'p0-calling-github-binding-rollback.json');
          fs.writeFileSync(destination, JSON.stringify(envelope, null, 2), {mode: 0o600});
          plaintext.fill(0); restored.fill(0); key.fill(0);
          const report = {credential_rollback: 'SEALED_AND_RECOVERY_VERIFIED', secret_values_exposed: false, secret_bindings_changed: false, fly_changes: false, production_deployed: false, recovery_requires: 'Existing unchanged GitHub FLY_API_TOKEN binding', artifact_retention_days: 90};
          console.log(JSON.stringify(report));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, JSON.stringify(report, null, 2) + '\n');
          JS

      - name: Preserve only the encrypted rollback artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-calling-github-binding-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/p0-calling-github-binding-rollback.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
